services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calyx
      POSTGRES_PASSWORD: calyx
      POSTGRES_DB: calyx
    # Host ports chosen to avoid common local conflicts; containers still use 5432/6379 internally.
    ports:
      - "15432:5432"
    volumes:
      - calyx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calyx -d calyx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - calyx_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://calyx:calyx@postgres:5432/calyx
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingestion:
    build: .
    command: ["npm", "run", "dev:ingestion"]
    environment:
      DATABASE_URL: postgres://calyx:calyx@postgres:5432/calyx
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      CALYX_INTERNAL_API_KEY: ${CALYX_INTERNAL_API_KEY:-}
    ports:
      - "13000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  consumer:
    build: .
    command: ["npm", "run", "dev:consumer"]
    environment:
      DATABASE_URL: postgres://calyx:calyx@postgres:5432/calyx
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Ships Eventio Loki streams into Calyx (tenant=eventio)
  loki-forwarder:
    build: .
    command: ["npm", "run", "dev:loki-forwarder"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOKI_URL: http://host.docker.internal:3101
      CALYX_INGEST_URL: http://ingestion:3000
      CALYX_TENANT_ID: eventio
      LOKI_QUERY: '{job=~"eventio|npm"}'
      LOKI_POLL_MS: "5000"
      LOKI_POSITION_FILE: /data/loki-forwarder-position.json
    volumes:
      - calyx_forwarder_data:/data
    depends_on:
      ingestion:
        condition: service_healthy
    restart: unless-stopped

  # Hosted MCP endpoint for Claude Code, Codex, Pi, Cursor, and other MCP clients.
  mcp:
    profiles: ["mcp"]
    build: .
    command: ["npm", "run", "dev:mcp:http"]
    environment:
      DATABASE_URL: postgres://calyx:calyx@postgres:5432/calyx
      MCP_PORT: "3002"
      MCP_SESSION_MODE: ${MCP_SESSION_MODE:-stateless}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_INTROSPECTION_URL: ${MCP_OAUTH_INTROSPECTION_URL:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
    ports:
      - "13002:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Durable detector scheduler and Slack alert delivery worker.
  detector:
    profiles: ["slack", "detector"]
    build: .
    command: ["npm", "run", "dev:detector"]
    environment:
      DATABASE_URL: postgres://calyx:calyx@postgres:5432/calyx
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      CALYX_TENANT_ID: ${CALYX_TENANT_ID:-}
      CALYX_SLACK_ALERT_CHANNEL: ${CALYX_SLACK_ALERT_CHANNEL:-}
      CALYX_SLACK_ALERT_CHANNELS: ${CALYX_SLACK_ALERT_CHANNELS:-{}}
      CALYX_DETECTION_INTERVAL_MS: ${CALYX_DETECTION_INTERVAL_MS:-60000}
      CALYX_ACTIVE_SERVICE_LOOKBACK_HOURS: ${CALYX_ACTIVE_SERVICE_LOOKBACK_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional: docker compose --profile slack up
  slack:
    profiles: ["slack"]
    build: .
    command: ["npm", "run", "dev:slack"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://calyx:calyx@postgres:5432/calyx
      REDIS_URL: redis://redis:6379
      SLACK_PORT: "3001"
      SLACK_SOCKET_MODE: ${SLACK_SOCKET_MODE:-true}
      # On-call is always Opus, even if .env sets CALYX_PROVIDER=nvidia
      CALYX_PROVIDER: anthropic
      CALYX_SLACK_MODEL: claude-opus-5
    ports:
      - "13001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Go chat API — Convex replacement for auth/workspaces/channels/messages
  chat-api:
    profiles: ["chat"]
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgres://calyx:calyx@postgres:5432/calyx
      ADDR: ":14000"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-calyx-chat-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "14000:14000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:14000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  calyx_pg_data:
  calyx_redis_data:
  calyx_forwarder_data:
