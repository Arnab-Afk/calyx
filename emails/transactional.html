<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="en" dir="ltr">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>{{heading}}</title>
  <!--
    Calyx transactional shell (light card, crimson accent).
    Tokens: {{preheader}} {{mark_url}} {{hero_url}} {{heading}} {{intro_html}}
            {{body_html}} {{signoff_html}} {{cta_url}} {{cta_label}}
            {{footer_brand}} {{footer_reason}} {{settings_url}}
    Drop the hero row, signoff, or CTA table when unused.
  -->
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style type="text/css">
    :root { color-scheme: light; supported-color-schemes: light; }
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; display: block; }
    body { margin: 0; padding: 0; width: 100% !important; background-color: #f4f2f3; }
    a { color: #c41228; }
    @media only screen and (max-width: 620px) {
      .calyx-card { width: 100% !important; }
      .calyx-pad { padding: 32px 24px !important; }
      .calyx-head { padding: 24px !important; }
      .calyx-h1 { font-size: 28px !important; line-height: 34px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f2f3;">
  <div style="display:none;overflow:hidden;line-height:1px;opacity:0;max-height:0;max-width:0;">
    {{preheader}}&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f2f3;">
    <tr>
      <td align="center" style="background-color:#f4f2f3;padding:32px 12px;">
        <table role="presentation" class="calyx-card" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e4dcde;">
          <tr>
            <td style="background-color:#e11d2e;height:4px;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td class="calyx-head" style="padding:28px 48px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="28" style="width:28px;vertical-align:middle;">
                    <img src="{{mark_url}}" alt="" width="28" height="28" style="display:block;border:0;width:28px;height:28px;" />
                  </td>
                  <td style="padding-left:10px;vertical-align:middle;">
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:22px;font-weight:600;letter-spacing:-0.02em;color:#0b0b0e;">Calyx</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Optional hero. Remove this row when the mail has no image. -->
          <tr>
            <td style="font-size:0;line-height:0;background-color:#12090c;">
              <img src="{{hero_url}}" alt="" width="600" style="display:block;width:100%;max-width:600px;height:auto;border:0;" />
            </td>
          </tr>
          <tr>
            <td class="calyx-pad" style="padding:40px 48px 48px 48px;">
              <h1 class="calyx-h1" style="margin:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:32px;line-height:40px;font-weight:600;letter-spacing:-0.02em;color:#0b0b0e;">
                {{heading}}
              </h1>
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#5c5557;">
                {{intro_html}}
              </div>
              {{body_html}}
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#5c5557;">
                {{signoff_html}}
              </div>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 28px 0;">
                <tr>
                  <td bgcolor="#e11d2e" style="background-color:#e11d2e;border-radius:4px;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{cta_url}}" style="height:46px;v-text-anchor:middle;width:200px;" arcsize="8%" fillcolor="#e11d2e" stroke="f">
                      <w:anchorlock/>
                      <center style="color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold;">{{cta_label}}</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <a href="{{cta_url}}" target="_blank" style="display:inline-block;padding:13px 22px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;">{{cta_label}}</a>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-top:1px solid #e8e0e2;padding-top:24px;">
                <tr>
                  <td>
                    <p style="margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#6e686a;">{{footer_brand}}</p>
                    <p style="margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#6e686a;">{{footer_reason}}</p>
                    <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;">
                      <a href="{{settings_url}}" target="_blank" style="color:#6e686a;text-decoration:underline;">Notification settings</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
